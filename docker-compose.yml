services:
  nginx:
    image: nginx
    ports:
      - "8085:80"
    volumes:
      - ./loud-frontend:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - django
      - fastapi
    networks:
      - conn

  postgresql:
    image: postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - ./database/loud-database.ddl:/docker-entrypoint-initdb.d/schema.sql
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - conn 

  django:
    build: ./loud-backend/django
    ports:
      - "8000:8000"
    volumes:
      - ./loud-backend/django:/app
    depends_on:
      postgresql:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - conn 

  fastapi:
    build: ./loud-backend/fastapi
    ports:
      - "8001:8000"
    volumes:
      - ./loud-backend/fastapi:/app
    depends_on:
      postgresql:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - conn 

  redis:
    image: redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - conn 

networks:
  conn:
    driver: bridge

volumes:
  postgres_data:
  redis_data: